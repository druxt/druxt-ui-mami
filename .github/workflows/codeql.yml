---
name: CodeQL

# Static security analysis of the module and the components, on the default
# branch, on pull requests into it, and weekly, so a new query reaches code
# that has not changed.

on:
  push:
    branches: [0.x]
  pull_request:
    branches: [0.x]
  schedule:
    - cron: '15 5 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # JavaScript needs no build: CodeQL reads the source, Vue files
      # included.
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3
        with:
          languages: javascript

      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3
